<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomume Studio | Mobile Apps & Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b, #0f172a, #020617);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .lang-switch {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .lang-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: #6366f1;
      color: #ffffff;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 20px;
      font-size: 32px;
      font-weight: 700;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.tagline {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
      min-height: 48px;
    }
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 13px 26px;
      border-radius: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 25px -5px rgba(59, 130, 246, 0.5);
    }
    footer {
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="lang-switch">
      <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btn-tr" onclick="setLang('tr')">TR</button>
    </div>

    <div class="logo-badge">T</div>
    <h1>Tomume Studio</h1>
    <p class="tagline" id="tagline">Crafting modern, lightweight, and engaging mobile apps & games for everyone.</p>
    
    <div class="divider"></div>

    <a href="mailto:muhammetappsupport@gmail.com" class="btn" id="contact-btn">
      ✉️ Contact & Support
    </a>

    <footer id="footer-text">
      © 2026 Tomume Studio. All rights reserved.
    </footer>
  </div>

  <script>
    const content = {
      en: {
        tagline: "Crafting modern, lightweight, and engaging mobile apps & games for everyone.",
        contact: "✉️ Contact & Support",
        footer: "© 2026 Tomume Studio. All rights reserved."
      },
      tr: {
        tagline: "Kullanıcı dostu, modern ve eğlenceli mobil uygulamalar ve oyunlar geliştiriyoruz.",
        contact: "✉️ Destek & İletişim",
        footer: "© 2026 Tomume Studio. Tüm hakları saklıdır."
      }
    };

    function setLang(lang) {
      document.getElementById('tagline').textContent = content[lang].tagline;
      document.getElementById('contact-btn').textContent = content[lang].contact;
      document.getElementById('footer-text').textContent = content[lang].footer;
      
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
    }
  </script>

</body>
</html>
